name = "web-pixel"
uid = "bf0c0bec-8f6f-89f8-bcb1-0723c5ee9461eaf9defa"
type = "web_pixel_extension"


runtime_context = "strict"

[customer_privacy]
analytics = false
marketing = false
preferences = false
sale_of_data = "disabled"

[settings]
type = "object"

[settings.fields.posthog_api_key]
name = "Posthog Project API Key"
description = "posthog_api_key"
type = "single_line_text_field"

[settings.fields.posthog_api_host]
name = "Posthog Project API Host"
description = "posthog_api_host"
type = "single_line_text_field"

[settings.fields.tracked_events]
name = "Tracked Events"
description = "Active events to track"
type = "single_line_text_field"


[settings.fields.data_collection_strategy]
name = "Data collection strategy"
description = "Data collection strategy"
type = "single_line_text_field"
validations =  [
  { name = "choices", value = "[\"anonymized\", \"non-anonymized\",\"non-anonymized-by-consent\"]" }
]

[settings.fields.posthog_ecommerce_spec]
name = "Toggle PostHog Ecommerce spec"
description = "Toggle PostHog Ecommerce spec"
type = "single_line_text_field"

[settings.fields.datalayer_enabled]
name = "Toggle GTM dataLayer"
description = "Toggle GTM dataLayer broadcast"
type = "single_line_text_field"

[settings.fields.iris_enabled]
name = "Enable Iris"
description = "Forward events to Iris Analytics"
type = "single_line_text_field"

[settings.fields.iris_api_key]
name = "Iris Publishable Key"
description = "iris_api_key"
type = "single_line_text_field"

[settings.fields.iris_api_host]
name = "Iris API Host"
description = "iris_api_host"
type = "single_line_text_field"

# Mirrors the iris_js_feature_toggle metafield. The pixel needs to know whether
# the Iris SDK theme embed is on, so it only waits for the SDK's identity when
# there is an SDK coming — otherwise every first event on a shop without the
# embed would pay the full timeout for nothing.
# Iris's own event-naming flag, independent of posthog_ecommerce_spec.
[settings.fields.iris_ecommerce_spec]
name = "Iris uses PostHog ecommerce spec names"
description = "iris_ecommerce_spec"
type = "single_line_text_field"

[settings.fields.iris_js_enabled]
name = "Iris SDK theme embed enabled"
description = "iris_js_enabled"
type = "single_line_text_field"
